<style>

  --bg1: #fff8ec;
  --bg2: #fdeedb;
  --card-bg: #ffffff;
  --surface-alt: #fbf6ec;
  --surface-alt-hover: #fff2e2;

  --primary: #ff8a3d;
  --primary-dark: #e6712a;
  --secondary: #4f8fef;
  --ok: #22c55e;
  --ok-bg: #f0fdf4;
  --ok-ink: #15803d;
  --no: #ef4444;
  --no-bg: #fef2f2;
  --no-ink: #b91c1c;
  --warn-ink: #b45309;
  --border: #e7d9c3;
  --input-bg: #ffffff;
  --blank-border: #b9a789;

  --btn-secondary-bg: #eef2ff;
  --btn-secondary-ink: #3546c9;
  --progress-bg: #f1f0fb;
  --progress-ink: #4b3fae;
  --chip-basic-bg: #e0f2fe;
  --chip-basic-ink: #0369a1;
  --chip-variant-bg: #fce7f3;
  --chip-variant-ink: #be185d;
  --chip-word-bg: #dcfce7;
  --chip-word-ink: #15803d;
  --result-row-bg: #f8f5ee;
  font-family: 'Noto Sans KR', 'Pretendard', -apple-system, sans-serif;
}

@media (prefers-color-scheme: dark) {

    --bg2: #1a130c;
    --card-bg: #2c2116;
    --surface-alt: #241b12;
    --surface-alt-hover: #3a2a17;
    --ink: #f3e9db;
    --muted: #b9a488;
    --primary: #ff9d51;
    --primary-dark: #ffb679;
    --secondary: #7fabff;
    --ok: #4ade80;
    --ok-bg: #163821;
    --ok-ink: #86efac;
    --no: #f87171;
    --no-bg: #3a1c1c;
    --no-ink: #fca5a5;
    --warn-ink: #fbbf6c;
    --border: #4a3a26;
    --input-bg: #2c2116;
    --blank-border: #6b5738;
    --shadow: rgba(0, 0, 0, 0.35);
    --btn-secondary-bg: #232a4a;
    --btn-secondary-ink: #aab6ff;
    --progress-bg: #262048;
    --progress-ink: #b6b0ff;
    --chip-basic-bg: #0c3752;
    --chip-basic-ink: #7cd4ff;
    --chip-variant-bg: #4a1d38;
    --chip-variant-ink: #ffa3d2;
    --chip-word-bg: #163a25;
    --chip-word-ink: #86efac;

  }
}
:root[data-theme="dark"] {
  --bg1: #241a10;
  --bg2: #1a130c;
  --card-bg: #2c2116;
  --surface-alt: #241b12;
  --surface-alt-hover: #3a2a17;
  --ink: #f3e9db;
  --muted: #b9a488;
  --primary: #ff9d51;
  --primary-dark: #ffb679;
  --secondary: #7fabff;
  --ok: #4ade80;
  --ok-bg: #163821;
  --ok-ink: #86efac;

  --no-bg: #3a1c1c;
  --no-ink: #fca5a5;

  --border: #4a3a26;

  --progress-ink: #b6b0ff;

  --chip-basic-ink: #7cd4ff;
  --chip-variant-bg: #4a1d38;

* { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
  color: var(--ink);
  min-height: 100vh;
}

#app {
  max-width: 720px;
  margin: 0 auto;
  padding: 20px 16px 60px;
}

#appHeader {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 4px 18px;
}

.brand {
  font-size: 1.25rem;
  font-weight: 800;
}

.student-badge {
  background: var(--primary);
  color: #fff;
  font-weight: 700;
  font-size: 0.85rem;
  padding: 6px 14px;
  border-radius: 999px;
}

#appFooter {
  text-align: center;
  color: var(--muted);
  font-size: 0.8rem;
  margin-top: 28px;
}

.card {
  background: var(--card-bg);
  border-radius: 20px;
  padding: 28px 24px;
  box-shadow: 0 6px 20px var(--shadow);
  border: 1px solid var(--border);
}

.start-card h1 {
  font-size: 1.4rem;
  margin: 0 0 8px;
  line-height: 1.4;
  text-wrap: balance;
}
.accent { color: var(--primary); }
.muted { color: var(--muted); margin-bottom: 20px; }

.field-label {
  display: block;
  font-weight: 700;
  margin-bottom: 6px;
}

.text-input {
  width: 100%;
  font-size: 1.1rem;
  padding: 12px 14px;
  border-radius: 12px;
  border: 2px solid var(--border);
  margin-bottom: 14px;
  background: var(--input-bg);
  color: var(--ink);
}
.text-input:focus { outline: none; border-color: var(--primary); }

.btn {
  display: inline-block;
  border: none;
  border-radius: 12px;
  padding: 13px 20px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  width: 100%;
  font-family: inherit;
}
.btn:focus-visible { outline: 3px solid var(--secondary); outline-offset: 2px; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-secondary { background: var(--btn-secondary-bg); color: var(--btn-secondary-ink); margin-top: 10px; }
.btn-ghost { background: transparent; color: var(--muted); margin-top: 18px; text-decoration: underline; }

.error-text { color: var(--no); font-weight: 600; margin-top: -6px; }

h2 { margin-top: 0; text-wrap: balance; }

.stage-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 18px 0 6px;
}
.stage-btn {
  border: 2px solid var(--border);
  background: var(--surface-alt);
  border-radius: 16px;
  padding: 16px 12px;
  text-align: left;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-family: inherit;
  color: var(--ink);
}
.stage-btn:hover { border-color: var(--primary); background: var(--surface-alt-hover); }
.stage-btn:focus-visible { outline: 3px solid var(--secondary); outline-offset: 2px; }
.stage-btn.done { border-color: var(--ok); }
.stage-btn:disabled { opacity: 0.55; cursor: not-allowed; }
.stage-btn:disabled:hover { border-color: var(--border); background: var(--surface-alt); }
.stage-num { font-weight: 800; color: var(--primary-dark); display: flex; align-items: center; gap: 6px; }
.stage-sub { font-size: 0.85rem; color: var(--ink); line-height: 1.35; }
.stage-lock-note { font-size: 0.78rem; color: var(--muted); font-weight: 600; margin-top: 2px; }

/* 에너지바(단계 도달 표시) */
.energy-bar-wrap { padding: 0 4px 16px; }
.energy-label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--muted);
  margin-bottom: 6px;
}
.energy-count { color: var(--primary-dark); font-variant-numeric: tabular-nums; }
.energy-bar { display: flex; gap: 6px; }
.energy-seg {
  flex: 1;
  height: 14px;
  border-radius: 999px;
  background: var(--progress-bg);
  border: 1px solid var(--border);
  transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
}
.energy-seg.done {
  background: linear-gradient(90deg, var(--ok), var(--primary));
  border-color: transparent;
}
.energy-seg.current { box-shadow: 0 0 0 2px var(--secondary); }

/* 시작 화면 - 미니 진행 현황 미리보기 */
.mini-progress { margin: 2px 0 18px; }
.mini-progress-label { font-size: 0.82rem; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
.mini-stage-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.mini-stage-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  border-radius: 10px;
  border: 2px solid var(--border);
  background: var(--surface-alt);
  font-weight: 700;
  font-size: 0.88rem;
  color: var(--ink);
}
.mini-stage-icon { flex: none; font-size: 1rem; }
.mini-stage-item.done { border-color: var(--ok); background: var(--ok-bg); color: var(--ok-ink); }
.mini-stage-item.next { border-color: var(--primary); background: var(--surface-alt-hover); color: var(--primary-dark); }
.mini-stage-item.locked { opacity: 0.55; }
.mini-progress-empty { font-size: 0.85rem; color: var(--muted); margin: 2px 0 18px; }

.problem-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.stage-chip {
  font-size: 0.8rem;
  color: var(--muted);
  font-weight: 700;
}
.progress-chip {
  background: var(--progress-bg);
  color: var(--progress-ink);
  font-size: 0.8rem;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 999px;
  font-variant-numeric: tabular-nums;
}

.cat-chip {
  display: inline-block;
  font-size: 0.75rem;
  font-weight: 800;
  padding: 4px 10px;
  border-radius: 999px;
  margin-bottom: 12px;

.cat-basic { background: var(--chip-basic-bg); color: var(--chip-basic-ink); }
.cat-variant { background: var(--chip-variant-bg); color: var(--chip-variant-ink); }
.cat-word { background: var(--chip-word-bg); color: var(--chip-word-ink); }

.prompt-text {
  font-size: 1.02rem;
  line-height: 1.6;

.method-label {
  font-size: 0.85rem;

  font-weight: 700;

}

.problem-body {
  background: var(--surface-alt);
  border-radius: 14px;
  padding: 20px 14px;
  margin-bottom: 16px;
  overflow-x: auto;
}

.step-row {
  font-size: 1.15rem;
  font-weight: 600;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
  line-height: 2.1;
  font-variant-numeric: tabular-nums;
}
.prompt-row { justify-content: center; gap: 10px; }

.frac {
  display: inline-flex;
  flex-direction: column;
  align-items: center;

  margin: 0 3px;

}
.frac .fu { border-bottom: 2.5px solid currentColor; padding: 0 4px 1px; line-height: 1.15; }
.frac .fd { padding: 3px 4px 0; line-height: 1.15; }

.mixed {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  margin: 0 3px;
  font-weight: 800;
}

.blank {
  text-align: center;
  border: 2px solid var(--blank-border);
  border-radius: 8px;
  padding: 4px 4px;
  font-size: 1rem;
  font-weight: 800;
  font-family: inherit;
  background: var(--input-bg);
  color: var(--ink);
  margin: 0 2px;
}
.blank:focus { outline: none; border-color: var(--secondary); }
.blank.correct { border-color: var(--ok); background: var(--ok-bg); color: var(--ok-ink); }
.blank.wrong { border-color: var(--no); background: var(--no-bg); color: var(--no-ink); }
.blank:disabled { opacity: 1; }

.ans-hint {
  font-size: 0.8rem;
  color: var(--no);
  font-weight: 700;
  margin-left: 2px;
}

.cmp-buttons {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-top: 4px;
  margin-bottom: 16px;
}
.cmp-btn {
  font-size: 1.3rem;
  font-weight: 800;
  width: 56px;
  height: 48px;
  border-radius: 12px;
  border: 2px solid var(--border);
  background: var(--input-bg);
  color: var(--ink);
  cursor: pointer;
  font-family: inherit;
}
.cmp-btn:focus-visible { outline: 3px solid var(--secondary); outline-offset: 2px; }
.cmp-btn.selected { border-color: var(--primary); background: var(--surface-alt-hover); color: var(--primary-dark); }
.cmp-slot {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 40px;
  height: 40px;
  border: 2px dashed var(--border);
  border-radius: 10px;
  font-weight: 800;
  font-size: 1.2rem;
}
.cmp-slot.correct { border-style: solid; border-color: var(--ok); background: var(--ok-bg); color: var(--ok-ink); }
.cmp-slot.wrong { border-style: solid; border-color: var(--no); background: var(--no-bg); color: var(--no-ink); }

.feedback-area { min-height: 26px; font-weight: 700; margin-bottom: 8px; }
.fb-ok { color: var(--ok); }
.fb-no { color: var(--no); }

.actions button { margin-top: 6px; }
.actions-col { display: flex; flex-direction: column; }

.score-line { font-size: 1.15rem; font-weight: 800; color: var(--primary-dark); font-variant-numeric: tabular-nums; }

.result-list { list-style: none; padding: 0; margin: 14px 0; display: flex; flex-direction: column; gap: 8px; }
.result-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  background: var(--result-row-bg);
}
.result-row.ok { background: var(--ok-bg); }
.result-row.no { background: var(--no-bg); }
.result-idx {
  width: 24px; height: 24px;
  border-radius: 50%;
  background: var(--card-bg);
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 0.8rem;
}
.result-cat { flex: 1; font-weight: 600; font-size: 0.9rem; }

.sheet-status {
  font-size: 0.85rem;
  color: var(--muted);
  margin-bottom: 6px;
}
.sheet-status.ok { color: var(--ok); font-weight: 700; }
.sheet-status.warn { color: var(--warn-ink); font-weight: 700; }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

@media (max-width: 420px) {
  .stage-grid { grid-template-columns: 1fr; }
  .step-row { font-size: 1rem; }
}

      <div id="studentBadge" class="student-badge" hidden></div>
    </header>
    <div id="energyBarWrap"></div>
    <main id="main"></main>
    <footer id="appFooter">4학년 2학기 수학 1단원 · 분수의 덧셈과 뺄셈</footer>
  </div>
  <script>
/* ============================================================
   4학년 2학기 분수의 덧셈과 뺄셈 - 단계별 복습 앱
   ============================================================ */

/* ---------------- 결과 저장 설정 ----------------
   구글 시트에 결과를 저장하려면, Google Apps Script를 웹 앱으로 배포한 뒤
   그 URL을 아래에 붙여넣으세요. (자세한 방법은 README.md 참고)
   설정하지 않으면 학생 기기(브라우저)에만 결과가 임시 저장됩니다. */
const SHEET_WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbyV-ln-HezsL7Scra7og23F3v26HkSNV1MeKg4RS5RLTW8NDbbXY42Y9msY56NEqE5xXw/exec';

/* ---------------- 기본 유틸 ---------------- */
const DENOMS = [3, 4, 5, 6, 7, 8, 9, 10, 12];
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function pick(arr) { return arr[randInt(0, arr.length - 1)]; }
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = randInt(0, i);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function ensureBothTrueFalse() {
  // 3개 슬롯 중 true/false(또는 typeA/typeB)가 골고루 섞이도록 보장
  const base = [true, false];
  const third = pick([true, false]);
  return shuffle([...base, third]);
}
function ensureBothAB() {
  const base = ['A', 'B'];
  const third = pick(['A', 'B']);
  return shuffle([...base, third]);
}
function uniqDigits(count, min = 1, max = 9) {
  const pool = [];
  for (let i = min; i <= max; i++) pool.push(i);
  return shuffle(pool).slice(0, count).sort((a, b) => a - b);
}

/* ---------------- 렌더링 헬퍼 (분수/대분수/빈칸) ---------------- */
let inputCounter = 0;
let currentAnswerMap = {}; // id -> expected answer(string)

function resetProblemRender() {
  inputCounter = 0;
  currentAnswerMap = {};
}
function ipt(answer, digits) {
  const id = 'in_' + (inputCounter++);
  currentAnswerMap[id] = String(answer);
  const size = Math.max(1.6, String(answer).length + 0.6);
  return `<input type="text" inputmode="numeric" autocomplete="off" class="blank" id="${id}" data-ans="${escapeHtml(String(answer))}" style="width:${size}em">`;
}
function frac(numHtml, denHtml) {
  return `<span class="frac"><span class="fu">${numHtml}</span><span class="fd">${denHtml}</span></span>`;
}
function mixedStatic(whole, num, den) {
  return `<span class="mixed">${whole}${frac(num, den)}</span>`;
}
function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* ============================================================
   단계 정의
   ============================================================ */
const STAGES = [
  { id: 1, title: '1단계', subtitle: '진분수 + 진분수', kind: 'add_proper' },
  { id: 2, title: '2단계', subtitle: '대분수 + 대분수', kind: 'add_mixed' },
  { id: 3, title: '3단계', subtitle: '진분수 - 진분수 / 1 - 진분수', kind: 'sub_proper' },
  { id: 4, title: '4단계', subtitle: '대분수 - 대분수 (받아내림 없음)', kind: 'sub_mixed_noborrow' },
  { id: 5, title: '5단계', subtitle: '(1보다 큰 자연수) - 대분수', kind: 'sub_nat_mixed' },
  { id: 6, title: '6단계', subtitle: '대분수 - 대분수 (받아내림 포함)', kind: 'sub_mixed_general' },
];

/* ============================================================
   숫자 생성기 (단계별)
   ============================================================ */
function genAddProper(forceCarry) {
  const d = pick(DENOMS);
  let n1, n2;
  if (forceCarry) {
    do { n1 = randInt(1, d - 1); n2 = randInt(1, d - 1); } while (!(n1 + n2 > d));
  } else {
    do { n1 = randInt(1, d - 1); n2 = randInt(1, d - 1); } while (n1 + n2 >= d);
  }
  return { d, n1, n2, carry: !!forceCarry };
}
function genAddMixed(forceCarry) {
  const d = pick(DENOMS);
  const w1 = randInt(1, 6), w2 = randInt(1, 6);
  let n1, n2;
  if (forceCarry) {
    do { n1 = randInt(1, d - 1); n2 = randInt(1, d - 1); } while (!(n1 + n2 > d));
  } else {
    do { n1 = randInt(1, d - 1); n2 = randInt(1, d - 1); } while (n1 + n2 >= d);
  }
  return { d, w1, n1, w2, n2, carry: !!forceCarry };
}
function genSubProperType(type) {
  const d = pick(DENOMS);
  if (type === 'proper') {
    let n1, n2;
    do { n1 = randInt(1, d - 1); n2 = randInt(1, d - 1); } while (n1 <= n2);
    return { d, n1, n2, subType: 'proper' };
  } else {
    const n2 = randInt(1, d - 1);
    return { d, n2, subType: 'one' };
  }
}
function genSubMixedNoBorrow() {
  const d = pick(DENOMS);
  const n2 = randInt(1, d - 2);
  const n1 = randInt(n2 + 1, d - 1);
  const w2 = randInt(1, 5);
  const w1 = randInt(w2 + 1, w2 + 5);
  return { d, w1, n1, w2, n2 };
}
function genSubNatMixed() {
  const d = pick(DENOMS);
  const w2 = randInt(1, 6);
  const n2 = randInt(1, d - 1);
  const N = randInt(w2 + 2, w2 + 7);
  return { d, N, w2, n2 };
}
function genSubMixedGeneral(forceBorrow) {
  const d = pick(DENOMS);
  const w2 = randInt(1, 5);
  const w1 = randInt(w2 + 1, w2 + 5);
  let n1, n2;
  if (forceBorrow) {
    n2 = randInt(2, d - 1);
    n1 = randInt(1, n2 - 1);
  } else {
    n2 = randInt(1, d - 2);
    n1 = randInt(n2 + 1, d - 1);
  }
  return { d, w1, n1, w2, n2, borrow: !!forceBorrow };
}

/* ============================================================
   단계-스캐폴드(빈칸 채우기) 렌더러
   ============================================================ */
function methodLabel(method) {
  if (method === 'A') return '① 자연수는 자연수끼리, 분수는 분수끼리 계산하기';
  if (method === 'B') return '② 자연수와 대분수를 모두 가분수로 바꾸어 계산하기';
  return '';
}

function buildAddProperSteps(v) {
  const { d, n1, n2, carry } = v;
  let row;
  if (!carry) {
    row = `${frac(n1, d)} + ${frac(n2, d)} = ${frac(ipt(n1 + n2), d)}`;
  } else {
    const rem = n1 + n2 - d;
    row = `${frac(n1, d)} + ${frac(n2, d)} = ${frac(ipt(n1 + n2), d)} = ${ipt(1)}${frac(ipt(rem), d)}`;
  }
  const finalWhole = carry ? 1 : 0;
  const finalNum = carry ? n1 + n2 - d : n1 + n2;
  return { html: `<div class="step-row">${row}</div>`, label: '', finalWhole, finalNum, d };
}

function buildAddMixedSteps(v, method) {
  const { d, w1, n1, w2, n2, carry } = v;
  const finalWhole = w1 + w2 + (carry ? 1 : 0);
  const finalNum = carry ? n1 + n2 - d : n1 + n2;
  let row;
  if (method === 'A') {
    if (!carry) {
      row = `${mixedStatic(w1, n1, d)} + ${mixedStatic(w2, n2, d)} = ${ipt(w1 + w2)}${frac(ipt(n1 + n2), d)}`;
    } else {
      row = `${mixedStatic(w1, n1, d)} + ${mixedStatic(w2, n2, d)} = ${ipt(w1 + w2)}${frac(ipt(n1 + n2), d)} = ${ipt(finalWhole)}${frac(ipt(finalNum), d)}`;
    }
  } else {
    const imp1 = w1 * d + n1, imp2 = w2 * d + n2, sumImp = imp1 + imp2;
    row = `${mixedStatic(w1, n1, d)} + ${mixedStatic(w2, n2, d)} = ${frac(ipt(imp1), d)} + ${frac(ipt(imp2), d)} = ${frac(ipt(sumImp), d)} = ${ipt(finalWhole)}${frac(ipt(finalNum), d)}`;
  }
  return { html: `<div class="step-row">${row}</div>`, label: methodLabel(method), finalWhole, finalNum, d };
}

function buildSubProperSteps(v) {
  const { d, subType } = v;
  let row, finalWhole = 0, finalNum;
  if (subType === 'proper') {
    const { n1, n2 } = v;
    finalNum = n1 - n2;
    row = `${frac(n1, d)} - ${frac(n2, d)} = ${frac(ipt(finalNum), d)}`;
  } else {
    const { n2 } = v;
    finalNum = d - n2;
    row = `1 - ${frac(n2, d)} = ${frac(ipt(d), d)} - ${frac(n2, d)} = ${frac(ipt(finalNum), d)}`;
  }
  return { html: `<div class="step-row">${row}</div>`, label: '', finalWhole, finalNum, d };
}

function buildSubMixedNoBorrowSteps(v, method) {
  const { d, w1, n1, w2, n2 } = v;
  const finalWhole = w1 - w2, finalNum = n1 - n2;
  let row;
  if (method === 'A') {
    row = `${mixedStatic(w1, n1, d)} - ${mixedStatic(w2, n2, d)} = ${ipt(finalWhole)}${frac(ipt(finalNum), d)}`;
  } else {
    const imp1 = w1 * d + n1, imp2 = w2 * d + n2, diff = imp1 - imp2;
    row = `${mixedStatic(w1, n1, d)} - ${mixedStatic(w2, n2, d)} = ${frac(ipt(imp1), d)} - ${frac(ipt(imp2), d)} = ${frac(ipt(diff), d)} = ${ipt(finalWhole)}${frac(ipt(finalNum), d)}`;
  }
  return { html: `<div class="step-row">${row}</div>`, label: methodLabel(method), finalWhole, finalNum, d };
}

function buildSubNatMixedSteps(v, method) {
  const { d, N, w2, n2 } = v;
  const finalWhole = N - 1 - w2, finalNum = d - n2;
  let row;
  if (method === 'A') {
    row = `${N} - ${mixedStatic(w2, n2, d)} = ${ipt(N - 1)}${frac(ipt(d), d)} - ${mixedStatic(w2, n2, d)} = ${ipt(finalWhole)}${frac(ipt(finalNum), d)}`;
  } else {
    const imp1 = N * d, imp2 = w2 * d + n2, diff = imp1 - imp2;
    row = `${N} - ${mixedStatic(w2, n2, d)} = ${frac(ipt(imp1), d)} - ${frac(ipt(imp2), d)} = ${frac(ipt(diff), d)} = ${ipt(finalWhole)}${frac(ipt(finalNum), d)}`;
  }
  return { html: `<div class="step-row">${row}</div>`, label: methodLabel(method), finalWhole, finalNum, d };
}

function buildSubMixedGeneralSteps(v, method) {
  const { d, w1, n1, w2, n2, borrow } = v;
  let finalWhole, finalNum;
  let row;
  if (!borrow) {
    finalWhole = w1 - w2; finalNum = n1 - n2;
    if (method === 'A') {
      row = `${mixedStatic(w1, n1, d)} - ${mixedStatic(w2, n2, d)} = ${ipt(finalWhole)}${frac(ipt(finalNum), d)}`;
    } else {
      const imp1 = w1 * d + n1, imp2 = w2 * d + n2, diff = imp1 - imp2;
      row = `${mixedStatic(w1, n1, d)} - ${mixedStatic(w2, n2, d)} = ${frac(ipt(imp1), d)} - ${frac(ipt(imp2), d)} = ${frac(ipt(diff), d)} = ${ipt(finalWhole)}${frac(ipt(finalNum), d)}`;
    }
  } else {
    finalWhole = w1 - 1 - w2; finalNum = d + n1 - n2;
    if (method === 'A') {
      row = `${mixedStatic(w1, n1, d)} - ${mixedStatic(w2, n2, d)} = ${ipt(w1 - 1)}${frac(ipt(d + n1), d)} - ${mixedStatic(w2, n2, d)} = ${ipt(finalWhole)}${frac(ipt(finalNum), d)}`;
    } else {
      const imp1 = w1 * d + n1, imp2 = w2 * d + n2, diff = imp1 - imp2;
      row = `${mixedStatic(w1, n1, d)} - ${mixedStatic(w2, n2, d)} = ${frac(ipt(imp1), d)} - ${frac(ipt(imp2), d)} = ${frac(ipt(diff), d)} = ${ipt(finalWhole)}${frac(ipt(finalNum), d)}`;
    }
  }
  return { html: `<div class="step-row">${row}</div>`, label: methodLabel(method), finalWhole, finalNum, d };
}

/* ============================================================
   변형(크기비교/카드) & 문장제 문제
   ============================================================ */
const UNITS = ['L', 'kg', 'm', '시간'];
const NAMES = ['민준', '서연', '지호', '하은', '도윤', '수아', '예준', '유나'];

function buildCompareProper() {
  const d = pick(DENOMS);
  let n1, n2;
  do { n1 = randInt(1, d - 1); n2 = randInt(1, d - 1); } while (n1 === n2);
  const answer = n1 > n2 ? '>' : '<';
  resetProblemRender();
  const promptHtml = `<div class="step-row prompt-row">${frac(n1, d)} <span class="cmp-slot" id="cmpSlot"></span> ${frac(n2, d)}</div>`;
  return { category: 'variant', promptText: '두 분수의 크기를 비교하여 >, <, = 를 골라 보세요.', bodyHtml: promptHtml, answerKind: 'compare', compareAnswer: answer };
}
function buildCompareMixed() {
  const d = pick(DENOMS);
  const w1 = randInt(1, 6), w2 = randInt(1, 6);
  let n1 = randInt(1, d - 1), n2 = randInt(1, d - 1);
  if (w1 === w2 && n1 === n2) n2 = n2 === d - 1 ? n2 - 1 : n2 + 1;
  const v1 = w1 + n1 / d, v2 = w2 + n2 / d;
  const answer = v1 > v2 ? '>' : (v1 < v2 ? '<' : '=');
  resetProblemRender();
  const promptHtml = `<div class="step-row prompt-row">${mixedStatic(w1, n1, d)} <span class="cmp-slot" id="cmpSlot"></span> ${mixedStatic(w2, n2, d)}</div>`;
  return { category: 'variant', promptText: '두 대분수의 크기를 비교하여 >, <, = 를 골라 보세요.', bodyHtml: promptHtml, answerKind: 'compare', compareAnswer: answer };
}
function buildCardProper() {
  const [a, b, c] = uniqDigits(3, 1, 9); // a<b<c
  const mode = pick(['max', 'min']);
  resetProblemRender();
  let num, den;
  if (mode === 'max') { num = b; den = c; } else { num = a; den = c; }
  const promptText = `숫자 카드 ${a}, ${b}, ${c} 중 두 장을 골라 만들 수 있는 ${mode === 'max' ? '가장 큰' : '가장 작은'} 진분수를 만들어 보세요.`;
  const bodyHtml = `<div class="step-row prompt-row">${frac(ipt(num), ipt(den))}</div>`;
  return { category: 'variant', promptText, bodyHtml, answerKind: 'inline' };
}
function buildCardMixed() {
  const [a, b, c] = uniqDigits(3, 1, 9); // a<b<c
  const mode = pick(['max', 'min']);
  resetProblemRender();
  let whole, num, den;
  if (mode === 'max') { whole = c; den = b; num = a; } else { whole = a; den = c; num = b; }
  const promptText = `숫자 카드 ${a}, ${b}, ${c} 를 모두 한 번씩 사용하여 만들 수 있는 ${mode === 'max' ? '가장 큰' : '가장 작은'} 대분수를 만들어 보세요.`;
  const bodyHtml = `<div class="step-row prompt-row">${ipt(whole)}${frac(ipt(num), ipt(den))}</div>`;
  return { category: 'variant', promptText, bodyHtml, answerKind: 'inline' };
}

function wordAnswerFraction(finalWhole, finalNum, d) {
  resetProblemRender();
  let bodyHtml;
  if (finalWhole > 0) {
    bodyHtml = `<div class="step-row prompt-row">답: ${ipt(finalWhole)}${frac(ipt(finalNum), d)}</div>`;
  } else {
    bodyHtml = `<div class="step-row prompt-row">답: ${frac(ipt(finalNum), d)}</div>`;
  }
  return bodyHtml;
}

function buildWordProblem(stageKind) {
  const name1 = pick(NAMES);
  let name2 = pick(NAMES);
  while (name2 === name1) name2 = pick(NAMES);
  const unit = pick(UNITS);
  if (stageKind === 'add_proper') {
    const v = genAddProper(Math.random() < 0.5);
    const finalWhole = v.carry ? 1 : 0;
    const finalNum = v.carry ? v.n1 + v.n2 - v.d : v.n1 + v.n2;
    const promptText = `${name1}(이)는 우유를 ${v.n1}/${v.d} ${unit} 마셨고, ${name2}(이)는 ${v.n2}/${v.d} ${unit} 마셨습니다. 두 사람이 마신 우유는 모두 몇 ${unit}일까요?`;
    return { category: 'word', promptText, bodyHtml: wordAnswerFraction(finalWhole, finalNum, v.d) };
  }
  if (stageKind === 'add_mixed') {
    const v = genAddMixed(Math.random() < 0.5);
    const finalWhole = v.w1 + v.w2 + (v.carry ? 1 : 0);
    const finalNum = v.carry ? v.n1 + v.n2 - v.d : v.n1 + v.n2;
    const promptText = `${name1}(이)는 리본을 ${v.w1} ${v.n1}/${v.d} ${unit} 가지고 있었는데, ${name2}(이)에게 ${v.w2} ${v.n2}/${v.d} ${unit}를 더 받았습니다. ${name1}(이)가 가진 리본은 모두 몇 ${unit}일까요?`;
    return { category: 'word', promptText, bodyHtml: wordAnswerFraction(finalWhole, finalNum, v.d) };
  }
  if (stageKind === 'sub_proper') {
    const type = pick(['proper', 'one']);
    const v = genSubProperType(type);
    if (type === 'proper') {
      const promptText = `물이 ${v.n1}/${v.d} ${unit} 있었는데 ${v.n2}/${v.d} ${unit}를 사용했습니다. 남은 물은 몇 ${unit}일까요?`;
      return { category: 'word', promptText, bodyHtml: wordAnswerFraction(0, v.n1 - v.n2, v.d) };
    } else {
      const promptText = `${name1}(이)는 케이크 1개를 가지고 있었는데 그중 ${v.n2}/${v.d} 만큼을 먹었습니다. 남은 케이크는 전체의 몇 만큼일까요?`;
      return { category: 'word', promptText, bodyHtml: wordAnswerFraction(0, v.d - v.n2, v.d) };
    }
  }
  if (stageKind === 'sub_mixed_noborrow') {
    const v = genSubMixedNoBorrow();
    const promptText = `${name1}(이)는 쌀 ${v.w1} ${v.n1}/${v.d} ${unit} 중에서 ${v.w2} ${v.n2}/${v.d} ${unit}를 사용했습니다. 남은 쌀은 몇 ${unit}일까요?`;
    return { category: 'word', promptText, bodyHtml: wordAnswerFraction(v.w1 - v.w2, v.n1 - v.n2, v.d) };
  }
  if (stageKind === 'sub_nat_mixed') {
    const v = genSubNatMixed();
    const promptText = `끈 ${v.N} ${unit}가 있었는데 그중 ${v.w2} ${v.n2}/${v.d} ${unit}를 사용했습니다. 남은 끈은 몇 ${unit}일까요?`;
    return { category: 'word', promptText, bodyHtml: wordAnswerFraction(v.N - 1 - v.w2, v.d - v.n2, v.d) };
  }
  if (stageKind === 'sub_mixed_general') {
    const v = genSubMixedGeneral(Math.random() < 0.5);
    const finalWhole = v.borrow ? v.w1 - 1 - v.w2 : v.w1 - v.w2;
    const finalNum = v.borrow ? v.d + v.n1 - v.n2 : v.n1 - v.n2;
    const promptText = `${name1}(이)는 밀가루 ${v.w1} ${v.n1}/${v.d} ${unit} 중에서 빵을 만드는 데 ${v.w2} ${v.n2}/${v.d} ${unit}를 사용했습니다. 남은 밀가루는 몇 ${unit}일까요?`;
    return { category: 'word', promptText, bodyHtml: wordAnswerFraction(finalWhole, finalNum, v.d) };
  }
}

/* ============================================================
   문제 세트 구성 (스테이지당 5문항)
   ============================================================ */
function buildBasicProblem(stageKind, method, forceParam) {
  resetProblemRender();
  let stepInfo, promptText;
  switch (stageKind) {
    case 'add_proper': {
      const v = genAddProper(forceParam);
      stepInfo = buildAddProperSteps(v);
      promptText = '아래 빈칸을 채워 계산을 완성해 보세요.';
      break;
    }
    case 'add_mixed': {
      const v = genAddMixed(forceParam);
      stepInfo = buildAddMixedSteps(v, method);
      promptText = '아래 빈칸을 채워 계산을 완성해 보세요.';
      break;
    }
    case 'sub_proper': {
      const v = genSubProperType(forceParam ? 'one' : 'proper');
      stepInfo = buildSubProperSteps(v);
      promptText = '아래 빈칸을 채워 계산을 완성해 보세요.';
      break;
    }
    case 'sub_mixed_noborrow': {
      const v = genSubMixedNoBorrow();
      stepInfo = buildSubMixedNoBorrowSteps(v, method);
      promptText = '아래 빈칸을 채워 계산을 완성해 보세요.';
      break;
    }
    case 'sub_nat_mixed': {
      const v = genSubNatMixed();
      stepInfo = buildSubNatMixedSteps(v, method);
      promptText = '아래 빈칸을 채워 계산을 완성해 보세요.';
      break;
    }
    case 'sub_mixed_general': {
      const v = genSubMixedGeneral(forceParam);
      stepInfo = buildSubMixedGeneralSteps(v, method);
      promptText = '아래 빈칸을 채워 계산을 완성해 보세요.';
      break;
    }
  }
  return {
    category: 'basic',
    promptText,
    methodLabel: stepInfo.label,
    bodyHtml: stepInfo.html,
    answerKind: 'stepfill',
    answerMap: currentAnswerMap,
  };
}

function buildVariantProblem(stageKind) {
  let p;
  if (stageKind === 'add_proper' || stageKind === 'sub_proper') {
    p = Math.random() < 0.5 ? buildCompareProper() : buildCardProper();
  } else {
    p = Math.random() < 0.5 ? buildCompareMixed() : buildCardMixed();
  }
  if (p.answerKind === 'inline') p.answerMap = currentAnswerMap;
  return p;
}

function buildWordProblemWrapped(stageKind) {
  const p = buildWordProblem(stageKind);
  p.answerKind = 'inline';
  p.answerMap = currentAnswerMap;
  return p;
}

function buildStageProblemSet(stage) {
  const kind = stage.kind;
  const problems = [];

  if (kind === 'add_proper' || kind === 'sub_proper') {
    // 방법 분리 없음. carry/type 골고루 섞기
    const flags = ensureBothTrueFalse();
    for (let i = 0; i < 3; i++) {
      problems.push(buildBasicProblem(kind, null, flags[i]));
    }
  } else if (kind === 'sub_mixed_noborrow') {
    // 항상 받아내림 없음. 방법만 골고루
    const methods = ensureBothAB();
    for (let i = 0; i < 3; i++) {
      problems.push(buildBasicProblem(kind, methods[i], null));
    }
  } else if (kind === 'sub_nat_mixed') {
    // 항상 받아내림 있음. 방법만 골고루
    const methods = ensureBothAB();
    for (let i = 0; i < 3; i++) {
      problems.push(buildBasicProblem(kind, methods[i], null));
    }
  } else {
    // add_mixed, sub_mixed_general: carry/borrow 와 방법 모두 골고루
    const flags = ensureBothTrueFalse();
    const methods = ensureBothAB();
    for (let i = 0; i < 3; i++) {
      problems.push(buildBasicProblem(kind, methods[i], flags[i]));
    }
  }

  problems.push(buildVariantProblem(kind));
  problems.push(buildWordProblemWrapped(kind));

  problems.forEach((p, i) => { p.slot = i + 1; p.stageId = stage.id; });
  return problems;
}

function buildReplacementProblem(stage, slot, prevCategory) {
  const kind = stage.kind;
  if (prevCategory === 'variant') return { ...buildVariantProblem(kind), slot, stageId: stage.id };
  if (prevCategory === 'word') return { ...buildWordProblemWrapped(kind), slot, stageId: stage.id };
  // basic: 임의의 method/flag 재생성
  let method = null, flag = null;
  if (['add_mixed', 'sub_mixed_noborrow', 'sub_nat_mixed', 'sub_mixed_general'].includes(kind)) method = pick(['A', 'B']);
  if (['add_proper', 'sub_proper', 'add_mixed', 'sub_mixed_general'].includes(kind)) flag = Math.random() < 0.5;
  return { ...buildBasicProblem(kind, method, flag), slot, stageId: stage.id };
}

/* ============================================================
   앱 상태 & 화면 렌더링
   ============================================================ */
const state = {
  studentNumber: null,
  stage: null,
  problems: [],
  results: [], // {correct: bool}
  current: 0,
  round: 1, // 1차, 2차(재도전)...
  firstPassScore: null,
  completedStages: new Set(), // 학생이 도달(완료)한 단계 id 집합
};

const mainEl = () => document.getElementById('main');
const badgeEl = () => document.getElementById('studentBadge');
const energyBarEl = () => document.getElementById('energyBarWrap');

function updateBadge() {
  const b = badgeEl();
  if (state.studentNumber) {
    b.hidden = false;
    b.textContent = `번호 ${state.studentNumber}`;
  } else {
    b.hidden = true;
  }
}

/* ---------------- 단계 진행도(에너지바) ---------------- */
function progressKey(num) { return 'fraction_app_progress_' + num; }

function loadCompletedStages(num) {
  try {
    const raw = JSON.parse(localStorage.getItem(progressKey(num)) || '[]');
    return new Set(raw);
  } catch (e) {
    return new Set();
  }
}

function saveCompletedStages() {
  if (!state.studentNumber) return;
  try {
    localStorage.setItem(progressKey(state.studentNumber), JSON.stringify([...state.completedStages]));
  } catch (e) {}
}

function setStudentNumber(num) {
  state.studentNumber = num;
  try { localStorage.setItem('fraction_app_student', num); } catch (e) {}
  state.completedStages = loadCompletedStages(num);
}

function isStageUnlocked(stageId, completedSet) {
  const set = completedSet || state.completedStages;
  const idx = STAGES.findIndex(s => s.id === stageId);
  if (idx <= 0) return true;
  return set.has(STAGES[idx - 1].id);
}

function markStageReached(stageId) {
  if (state.completedStages.has(stageId)) return;
  state.completedStages.add(stageId);
  saveCompletedStages();
}

function renderEnergyBar(currentStageId) {
  const segs = STAGES.map(s => {
    const done = state.completedStages.has(s.id);
    const isCurrent = currentStageId === s.id;
    let cls = 'energy-seg';
    if (done) cls += ' done';
    if (isCurrent) cls += ' current';
    return `<div class="${cls}" title="${escapeHtml(s.title)}${done ? ' 도달 완료' : ' 미도달'}"></div>`;
  }).join('');
  return `
    <div class="energy-bar-wrap">
      <div class="energy-label"><span>단계 도달 현황</span><span class="energy-count">${state.completedStages.size} / ${STAGES.length}단계</span></div>
      <div class="energy-bar">${segs}</div>
    </div>
  `;
}

function updateEnergyBar(currentStageId) {
  const el = energyBarEl();
  if (!el) return;
  el.innerHTML = state.studentNumber ? renderEnergyBar(currentStageId) : '';
}

function progressPreviewHtml(num) {
  if (!num) {
    return `<p class="mini-progress-empty">번호를 입력하면 지금까지 깬 단계를 보여드려요.</p>`;
  }
  const set = loadCompletedStages(num);
  const items = STAGES.map(s => {
    const done = set.has(s.id);
    const unlocked = isStageUnlocked(s.id, set);
    const cls = 'mini-stage-item' + (done ? ' done' : (unlocked ? ' next' : ' locked'));
    const icon = done ? '✅' : (unlocked ? '▶️' : '🔒');
    return `<li class="${cls}"><span class="mini-stage-icon">${icon}</span><span>${escapeHtml(s.title)}: ${escapeHtml(s.subtitle)}</span></li>`;
  }).join('');
  return `
    <div class="mini-progress">
      <div class="mini-progress-label">번호 ${escapeHtml(num)}님의 진행 현황 · ${set.size} / ${STAGES.length}단계 완료</div>
      <ul class="mini-stage-list">${items}</ul>
    </div>
  `;
}

function init() {
  try {
    const saved = localStorage.getItem('fraction_app_student');
    if (saved) setStudentNumber(saved);
  } catch (e) {}
  renderStart();
}

function renderStart() {
  updateBadge();
  updateEnergyBar(null);
  mainEl().innerHTML = `
    <section class="card start-card">
      <h1>분수의 덧셈과 뺄셈 <span class="accent">단계별 복습</span></h1>
      <p class="muted">번호를 입력하고 시작해요. 6단계를 차례로 복습하며 실력을 키워 보세요!</p>
      <label class="field-label" for="studentNumInput">내 번호</label>
      <input id="studentNumInput" type="text" inputmode="numeric" placeholder="예: 12" value="${state.studentNumber ? escapeHtml(state.studentNumber) : ''}" class="text-input" />
      <div id="startProgress">${progressPreviewHtml(state.studentNumber)}</div>
      <button id="startBtn" class="btn btn-primary">시작하기</button>
      <p id="startError" class="error-text" hidden>번호를 입력해 주세요.</p>
    </section>
  `;
  const numInput = document.getElementById('studentNumInput');
  numInput.addEventListener('input', () => {
    document.getElementById('startProgress').innerHTML = progressPreviewHtml(numInput.value.trim());
  });
  document.getElementById('startBtn').addEventListener('click', () => {
    const val = numInput.value.trim();
    if (!val) { document.getElementById('startError').hidden = false; return; }
    setStudentNumber(val);
    renderStageSelect();
  });
  numInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('startBtn').click();
  });
}

function renderStageSelect() {
  updateBadge();
  updateEnergyBar(null);
  const cards = STAGES.map(s => {
    const unlocked = isStageUnlocked(s.id);
    const done = state.completedStages.has(s.id);
    return `
    <button class="stage-btn${done ? ' done' : ''}" data-stage="${s.id}" ${unlocked ? '' : 'disabled aria-disabled="true"'}>
      <span class="stage-num">${s.title} ${done ? '✅' : (unlocked ? '' : '🔒')}</span>
      <span class="stage-sub">${s.subtitle}</span>
      ${unlocked ? '' : '<span class="stage-lock-note">이전 단계를 먼저 완료해 보세요</span>'}
    </button>
  `;
  }).join('');
  mainEl().innerHTML = `
    <section class="card">
      <h2>단계를 선택하세요</h2>
      <p class="muted">1단계부터 순서대로 도전하면 다음 단계가 열려요!</p>
      <div class="stage-grid">${cards}</div>
      <button id="changeNumBtn" class="btn btn-ghost">번호 다시 입력</button>
    </section>
  `;
  document.querySelectorAll('.stage-btn').forEach(btn => {
    if (btn.disabled) return;
    btn.addEventListener('click', () => {
      const stage = STAGES.find(s => s.id === Number(btn.dataset.stage));
      if (!isStageUnlocked(stage.id)) return;
      startStage(stage);
    });
  });
  document.getElementById('changeNumBtn').addEventListener('click', () => {
    state.studentNumber = null;
    renderStart();
  });
}

function startStage(stage) {
  if (!isStageUnlocked(stage.id)) return;
  state.stage = stage;
  state.problems = buildStageProblemSet(stage);
  state.results = new Array(state.problems.length).fill(null);
  state.current = 0;
  state.round = 1;
  renderProblem();
}

function categoryLabel(cat) {
  if (cat === 'basic') return '기본 연산';
  if (cat === 'variant') return '변형 문제';
  if (cat === 'word') return '문장제';
  return '';
}

function renderProblem() {
  updateBadge();
  updateEnergyBar(state.stage.id);
  const p = state.problems[state.current];
  const total = state.problems.length;
  mainEl().innerHTML = `
    <section class="card problem-card">
      <div class="problem-header">
        <span class="stage-chip">${state.stage.title} · ${state.stage.subtitle}</span>
        <span class="progress-chip">${state.current + 1} / ${total}</span>
      </div>
      <div class="cat-chip cat-${p.category}">${categoryLabel(p.category)}</div>
      ${p.promptText ? `<p class="prompt-text">${escapeHtml(p.promptText)}</p>` : ''}
      ${p.methodLabel ? `<p class="method-label">${escapeHtml(p.methodLabel)}</p>` : ''}
      <div class="problem-body">${p.bodyHtml}</div>
      ${p.answerKind === 'compare' ? renderCompareButtons() : ''}
      <div id="feedbackArea" class="feedback-area"></div>
      <div class="actions">
        <button id="checkBtn" class="btn btn-primary">채점하기</button>
        <button id="nextBtn" class="btn btn-secondary" hidden>다음 문제</button>
      </div>
    </section>
  `;

  if (p.answerKind === 'compare') {
    document.querySelectorAll('.cmp-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.cmp-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        btn.dataset.selected = 'true';
        document.getElementById('cmpSlot').textContent = btn.dataset.val;
        document.getElementById('cmpSlot').dataset.chosen = btn.dataset.val;
      });
    });
  }

  document.getElementById('checkBtn').addEventListener('click', () => gradeProblem(p));
  document.getElementById('nextBtn').addEventListener('click', () => {
    state.current++;
    if (state.current < state.problems.length) {
      renderProblem();
    } else {
      renderResult();
    }
  });
}

function renderCompareButtons() {
  return `
    <div class="cmp-buttons">
      <button class="cmp-btn" data-val="&gt;">&gt;</button>
      <button class="cmp-btn" data-val="=">=</button>
      <button class="cmp-btn" data-val="&lt;">&lt;</button>
    </div>
  `;
}

function gradeProblem(p) {
  let allCorrect = true;
  if (p.answerKind === 'stepfill' || p.answerKind === 'inline') {
    const map = p.answerMap || {};
    const ids = Object.keys(map);
    if (ids.length === 0) allCorrect = false;
    ids.forEach(id => {
      const input = document.getElementById(id);
      if (!input) { allCorrect = false; return; }
      const val = input.value.trim();
      const ok = val !== '' && Number(val) === Number(map[id]);
      input.classList.add(ok ? 'correct' : 'wrong');
      input.disabled = true;
      if (!ok) {
        allCorrect = false;
        const hint = document.createElement('span');
        hint.className = 'ans-hint';
        hint.textContent = ` (정답: ${map[id]})`;
        input.insertAdjacentElement('afterend', hint);
      }
    });
  } else if (p.answerKind === 'compare') {
    const slot = document.getElementById('cmpSlot');
    const chosen = slot.dataset.chosen;
    const decoded = chosen === '&gt;' ? '>' : (chosen === '&lt;' ? '<' : chosen);
    allCorrect = decoded === p.compareAnswer;
    document.querySelectorAll('.cmp-btn').forEach(b => b.disabled = true);
    slot.classList.add(allCorrect ? 'correct' : 'wrong');
    if (!allCorrect) {
      const hint = document.createElement('span');
      hint.className = 'ans-hint';
      hint.textContent = ` (정답: ${p.compareAnswer})`;
      slot.insertAdjacentElement('afterend', hint);
    }
  }

  state.results[state.current] = allCorrect;
  const fb = document.getElementById('feedbackArea');
  fb.innerHTML = allCorrect
    ? `<span class="fb-ok">정답이에요! 잘했어요 🎉</span>`
    : `<span class="fb-no">아쉬워요. 빨간 칸의 정답을 확인해 보세요.</span>`;
  document.getElementById('checkBtn').hidden = true;
  document.getElementById('nextBtn').hidden = false;
}

function renderResult() {
  updateBadge();
  const total = state.problems.length;
  const correctCount = state.results.filter(r => r === true).length;
  if (state.round === 1) state.firstPassScore = correctCount;
  const wrongCount = total - correctCount;
  const cleared = wrongCount === 0;
  if (cleared) markStageReached(state.stage.id);
  updateEnergyBar(state.stage.id);

  const rows = state.problems.map((p, i) => `
    <li class="result-row ${state.results[i] ? 'ok' : 'no'}">
      <span class="result-idx">${i + 1}</span>
      <span class="result-cat">${categoryLabel(p.category)}</span>
      <span class="result-mark">${state.results[i] ? '✅' : '❌'}</span>
    </li>
  `).join('');

  const roundLabel = state.round === 1 ? '1차 시도' : `재도전 ${state.round - 1}회차`;

  mainEl().innerHTML = `
    <section class="card">
      <h2>${state.stage.title} 결과 (${roundLabel})</h2>
      <p class="score-line">${correctCount} / ${total} 문제 정답!</p>
      <ul class="result-list">${rows}</ul>
      <div id="sheetStatus" class="sheet-status">구글 시트에 결과를 저장하는 중...</div>
      ${!cleared ? `<p class="mini-progress-empty">틀린 문제를 모두 맞혀야 다음 단계로 넘어갈 수 있어요. 틀린 문제를 마저 풀어 보세요!</p>` : ''}
      <div class="actions actions-col">
        ${!cleared ? `<button id="retryBtn" class="btn btn-primary">틀린 문제 마저 풀기 (${wrongCount}문제)</button>` : `<button id="backStageBtn" class="btn btn-secondary">단계 선택으로</button>`}
      </div>
    </section>
  `;

  logResult({
    studentNumber: state.studentNumber,
    stageId: state.stage.id,
    stageTitle: `${state.stage.title} ${state.stage.subtitle}`,
    round: state.round,
    correct: correctCount,
    total,
    wrongCategories: state.problems.filter((p, i) => !state.results[i]).map(p => categoryLabel(p.category)).join(', '),
  }).then(ok => {
    const el = document.getElementById('sheetStatus');
    if (!el) return;
    el.textContent = ok ? '구글 시트에 결과가 저장되었어요 ✅' : '구글 시트 저장에 실패해 기기에 임시 저장했어요.';
    el.classList.add(ok ? 'ok' : 'warn');
  });

  const retryBtn = document.getElementById('retryBtn');
  if (retryBtn) {
    retryBtn.addEventListener('click', () => startRetryRound());
  }
  const backStageBtn = document.getElementById('backStageBtn');
  if (backStageBtn) {
    backStageBtn.addEventListener('click', renderStageSelect);
  }
}

function startRetryRound() {
  const newProblems = [];
  state.problems.forEach((p, i) => {
    if (!state.results[i]) {
      newProblems.push(buildReplacementProblem(state.stage, p.slot, p.category));
    }
  });
  state.problems = newProblems;
  state.results = new Array(newProblems.length).fill(null);
  state.current = 0;
  state.round += 1;
  renderProblem();
}

/* ============================================================
   결과 저장 (구글 시트 웹훅, 미설정/실패 시 로컬 저장)
   ============================================================ */
function saveResultLocally(record) {
  try {
    const key = 'fraction_app_pending_logs';
    const list = JSON.parse(localStorage.getItem(key) || '[]');
    list.push(record);
    localStorage.setItem(key, JSON.stringify(list));
  } catch (e) {}
}

async function logResult(payload) {
  const record = { ...payload, timestamp: new Date().toISOString() };
  if (!SHEET_WEBHOOK_URL) {
    saveResultLocally(record);
    return false;
  }
  try {
    const res = await fetch(SHEET_WEBHOOK_URL, {
      method: 'POST',
      // text/plain avoids a CORS preflight; Apps Script still reads the raw JSON body.
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(record),
    });
    const data = await res.json().catch(() => null);
    if (!res.ok || !data || !data.ok) throw new Error('sheet log failed');
    return true;
  } catch (e) {
    saveResultLocally(record);
    return false;
  }
}

document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
